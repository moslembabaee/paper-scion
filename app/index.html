<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0e" />
    <script>
      try {
        if (localStorage.getItem('paper.studio.theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <meta name="description" content="Paper — an open-source, self-hosted space for your design ideas." />
    <title>Paper — Space to think</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
