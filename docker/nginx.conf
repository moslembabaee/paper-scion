server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Long-lived cache for hashed assets (Vite fingerprints these)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Healthcheck endpoint — no disk I/O, Nginx returns 200 directly
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Self-hosting advertises cloud capability; static builds ship cloud:false.
    location = /cloud.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"cloud":true}';
    }

    location /api/ {
        proxy_pass http://paper-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
        client_max_body_size 17m;
    }

    location = /mcp {
        proxy_pass http://paper-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve MCP session/version headers and flush SSE frames immediately.
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        client_max_body_size 17m;
    }

    location /__paper_collaboration/ {
        proxy_pass http://paper-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 17m;
    }

    # SPA fallback: every unmatched path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
